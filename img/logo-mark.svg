<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="tcbMarkTitle">
  <title id="tcbMarkTitle">Taller Costa Brava — emblema</title>
  <!-- Emblema de la marca, tomado del coche del cartel del taller:
       silueta de turismo de perfil con las ventanillas y las ruedas
       recortadas. Sin texto, para que se lea igual a 16 px que a 400 px. -->
  <rect x="1.6" y="1.6" width="60.8" height="60.8" rx="15" fill="#3e0e05"/>
  <rect x="2.6" y="2.6" width="58.8" height="58.8" rx="14.4" fill="none" stroke="#83322c" stroke-width="2"/>

  <g transform="translate(32 32) scale(1.05) translate(-32 -32)">
    <!-- carrocería -->
    <path fill="#fff7e6" d="M6.6 38.2C6.6 36 7 34.6 7.6 33.4C8.4 32 9.4 31.2 10.8 30.4C14.4 29.6 18.3 28.7 21.5 26.1L26.9 21.6C29.6 20.4 33.8 20.3 36.6 20.6L45 27.4C50.2 29 54 29.2 56.2 30.6C58 31.7 58.6 34.4 57.5 38.2Z"/>
    <!-- ventanillas -->
    <path fill="#3e0e05" d="M24.3 26.2L28 22.9C30.4 22.2 33.8 22.2 36 22.6L41.4 26.2Z"/>
    <rect x="32.5" y="22.3" width="1.4" height="3.9" fill="#fff7e6"/>
    <!-- ruedas -->
    <circle cx="21.8" cy="38.2" r="5.5" fill="#3e0e05"/>
    <circle cx="47.2" cy="38.2" r="5.5" fill="#3e0e05"/>
  </g>
</svg>
